[package]
name = "Lumina"
default-run = "Lumina"
version.workspace = true
description = "A modern, cross-platform desktop application for Bible verse projection and reading. It enables small teams—or even a single operator—to manage Bible verse projections efficiently and confidently, without requiring a complex production setup."
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "lumina_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
lumina-app.workspace = true
lumina-persistence.workspace = true
thiserror.workspace = true
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-process = "2"
tauri-plugin-updater = "2"
rfd = { version = "=0.17.2", features = ["common-controls-v6"] }
base64 = "0.22.1"
tokio = { version = "1", features = ["time"] }
serde.workspace = true
serde_json.workspace = true
specta.workspace = true
tauri-specta = { version = "=2.0.0-rc.25", features = ["derive", "typescript"] }
specta-typescript = "=0.0.12"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.4"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["NSApplication", "NSButton", "NSControl", "NSResponder", "NSView", "NSWindow"] }

[dev-dependencies]
tempfile = "3.27.0"

[lints]
workspace = true
