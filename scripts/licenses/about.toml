# Prefer permissive options when a crate offers a choice. MPL-covered files
# retain their own rights and source locations in the generated notices.
accepted = [
    "MIT", "Apache-2.0", "BSD-2-Clause", "BSD-3-Clause", "ISC", "Zlib",
    "Unicode-3.0", "CC0-1.0", "MIT-0", "0BSD", "Unlicense", "MPL-2.0",
    "Apache-2.0 WITH LLVM-exception",
]
ignore-dev-dependencies = true
ignore-build-dependencies = true
private = { ignore = true }
