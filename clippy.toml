# These upstream crates require incompatible versions in the locked desktop,
# SQLite, and test dependency graphs. Keep duplicate-version checking enabled
# for every other crate; remove entries as upstream dependency ranges converge.
allowed-duplicate-crates = [
  "base64",
  "bitflags",
  # Updater HTTP proxy support uses core-foundation 0.9; Tauri/TLS use 0.10.
  "core-foundation",
  "foldhash",
  "getrandom",
  "hashbrown",
  "heck",
  "indexmap",
  # Tauri's Android bindings and the updater TLS verifier use different JNI APIs.
  "jni",
  "jni-sys",
  "png",
  "proc-macro-crate",
  # rfd Wayland scanner and Tauri plist require different quick-xml series.
  "quick-xml",
  "schemars",
  "serde_spanned",
  "syn",
  "thiserror",
  "thiserror-impl",
  "toml_datetime",
  "toml_edit",
  # Opener uses WinRT 0.61 while the updated Tauri runtime uses 0.62.
  "windows",
  "windows-collections",
  "windows-core",
  "windows-future",
  "windows-link",
  "windows-numerics",
  "windows-result",
  "windows-strings",
  "windows-sys",
  "windows-targets",
  "windows-threading",
  "windows_aarch64_gnullvm",
  "windows_aarch64_msvc",
  "windows_i686_gnu",
  "windows_i686_msvc",
  "windows_x86_64_gnu",
  "windows_x86_64_gnullvm",
  "windows_x86_64_msvc",
  "winnow",
  "wit-bindgen",
]
