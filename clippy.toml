# These upstream crates require incompatible versions in the locked desktop,
# SQLite, and test dependency graphs. Keep duplicate-version checking enabled
# for every other crate; remove entries as upstream dependency ranges converge.
allowed-duplicate-crates = [
  "base64",
  "bitflags",
  "foldhash",
  "getrandom",
  "hashbrown",
  "heck",
  "indexmap",
  "jni-sys",
  "png",
  "proc-macro-crate",
  "schemars",
  "serde_spanned",
  "syn",
  "thiserror",
  "thiserror-impl",
  "toml_datetime",
  "toml_edit",
  "windows-link",
  "windows-sys",
  "windows-targets",
  "windows_aarch64_gnullvm",
  "windows_aarch64_msvc",
  "windows_i686_gnu",
  "windows_i686_msvc",
  "windows_x86_64_gnu",
  "windows_x86_64_gnullvm",
  "windows_x86_64_msvc",
  "winnow",
  "wit-bindgen",
]
