name: Frontend CI
permissions:
  contents: read

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    paths-ignore:
      - "src-tauri/**"
      - "README.md"

jobs:
  lint:
    name: Lint Frontend
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest]

    runs-on: ${{ matrix.os }}

    concurrency:
      group: frontend-lint-${{ github.ref }}
      cancel-in-progress: true

    steps:
      - name: Checkout repository code
        uses: actions/checkout@v7

      - name: Set up pnpm package manager
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: "pnpm"

      - name: Install dependencies from lockfile
        run: pnpm install --frozen-lockfile

      - name: Run typecheck
        run: pnpm typecheck

      - name: Run lint step
        run: pnpm lint:ci
