name: Private installers

on:
  push:
    tags: [v*]
  workflow_dispatch:
    inputs:
      source_ref:
        description: Application source branch, tag, or commit
        type: string
        required: true
        default: beta
      platform:
        description: Installer targets
        type: choice
        options: [all, macos-universal, windows-x64, linux-x64]
        default: all
      mode:
        description: POC uses local updates and separate app data; both modes stay private
        type: choice
        options: [poc, production]
        default: poc
      app_version:
        description: Optional POC beta version override; blank uses committed Cargo version
        type: string
        required: false
      publication:
        description: Build only, or rehearse uploads into an unpublished destination draft
        type: choice
        options: [none, draft]
        default: none
      runtime_check:
        description: Verify only the Linux runtime sources and relinking inputs
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: installers-${{ github.ref }}-${{ inputs.source_ref }}-${{ inputs.platform }}-${{ inputs.mode }}-${{ inputs.app_version }}-${{ inputs.publication }}-${{ inputs.runtime_check }}
  cancel-in-progress: false

jobs:
  runtime:
    name: Verify Linux runtime source materials
    if: github.event_name == 'workflow_dispatch' && inputs.runtime_check
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - name: Checkout runtime build tooling
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Build and relink the controlled runtime
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import sys
          sys.path.insert(0, 'scripts')
          from linux_appimage import build_runtime
          work = Path('target/runtime-check').resolve()
          work.mkdir(parents=True)
          build_runtime(work)
          PY
  plan:
    if: ${{ !inputs.runtime_check }}
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      source_sha: ${{ steps.plan.outputs.source_sha }}
      version: ${{ steps.plan.outputs.version }}
      mode: ${{ steps.plan.outputs.mode }}
      publication: ${{ steps.plan.outputs.publication }}
      infrastructure_sha: ${{ steps.infrastructure.outputs.commit }}
    steps:
      - name: Check publication credential setup
        if: github.event_name == 'push' || inputs.publication == 'draft'
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
          RELEASE_PUBLICATION: ${{ github.event_name == 'push' && 'release' || 'draft' }}
        run: |
          if [[ -z "$GH_TOKEN" ]]; then
            echo "Configure RELEASES_TOKEN before selecting publication."
            exit 1
          fi
          destination=$(gh api repos/Kertsu/lumina-releases --jq '"\(.private) \(.has_pages)"')
          if [[ "$RELEASE_PUBLICATION" == "release" && "$destination" != "false true" ]]; then
            echo "Launch requires a public releases repository with Pages enabled. Use a draft until ready."
            exit 1
          fi
      - name: Checkout workflow infrastructure
        id: infrastructure
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'push' && 'beta-release' || github.sha }}
          path: infrastructure
          persist-credentials: false
      - name: Resolve application source
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'push' && github.ref || inputs.source_ref }}
          path: app
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: infrastructure/.node-version
      - name: Validate source, signing setup, and target selection
        id: plan
        env:
          INSTALLER_PLATFORM: ${{ inputs.platform || 'all' }}
          INSTALLER_MODE: ${{ inputs.mode || 'production' }}
          INSTALLER_VERSION: ${{ inputs.app_version }}
          INSTALLER_PUBLICATION: ${{ github.event_name == 'push' && 'release' || inputs.publication }}
          INSTALLER_TAG: ${{ github.event_name == 'push' && github.ref_name || '' }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: >-
          node infrastructure/scripts/release.mjs plan
          --source app --platform "$INSTALLER_PLATFORM"
          --mode "$INSTALLER_MODE" --version "$INSTALLER_VERSION"
          --publication "$INSTALLER_PUBLICATION" --tag "$INSTALLER_TAG"

  build:
    needs: plan
    name: ${{ matrix.id }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    defaults:
      run:
        shell: bash
        working-directory: app
    env:
      INSTALLER_TARGET: ${{ matrix.id }}
      INSTALLER_MODE: ${{ needs.plan.outputs.mode }}
      INSTALLER_VERSION: ${{ inputs.app_version }}
      APPIMAGE_EXTRACT_AND_RUN: "1"
    steps:
      - name: Checkout workflow infrastructure
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.plan.outputs.infrastructure_sha }}
          path: infrastructure
          persist-credentials: false
      - name: Checkout pinned application source
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.plan.outputs.source_sha }}
          path: app
          persist-credentials: false
      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          package_json_file: app/package.json
        env:
          NPM_CONFIG_AUDIT: "false"
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: app/.node-version
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - name: Install dependencies from lockfile
        run: pnpm install --frozen-lockfile
      - name: Install Linux packaging prerequisites
        if: runner.os == 'Linux'
        timeout-minutes: 10
        run: |
          # Avoid the runner's Azure mirror and the Firefox Snap transition.
          sudo sed -i 's|http://azure\.archive\.ubuntu\.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' /etc/apt/apt-mirrors.txt
          sudo apt-mark hold firefox
          # Keep source packages available for the exact native binaries bundled.
          sed -n 's/^deb /deb-src /p' /etc/apt/sources.list | \
            sudo tee /etc/apt/sources.list.d/lumina-sources.list >/dev/null
          test -s /etc/apt/sources.list.d/lumina-sources.list
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            build-essential pkg-config libwebkit2gtk-4.1-dev libxdo-dev \
            libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf libfuse2 \
            squashfs-tools zstd libgdk-pixbuf2.0-bin
      - name: Install Linux updater signature verifier
        if: runner.os == 'Linux'
        run: |
          curl --fail --location --retry 3 \
            --output "$RUNNER_TEMP/minisign.tar.gz" \
            https://github.com/jedisct1/minisign/releases/download/0.12/minisign-0.12-linux.tar.gz
          echo "9a599b48ba6eb7b1e80f12f36b94ceca7c00b7a5173c95c3efc88d9822957e73  $RUNNER_TEMP/minisign.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/minisign.tar.gz" -C "$RUNNER_TEMP" minisign-linux/x86_64/minisign
          echo "$RUNNER_TEMP/minisign-linux/x86_64" >> "$GITHUB_PATH"
      - name: Install declared Rust toolchain
        run: rustup toolchain install --no-self-update
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: app -> target
          key: installers-${{ matrix.id }}
      - name: Prepare target, version, and updater configuration
        run: >-
          node ../infrastructure/scripts/release.mjs prepare
          --source . --target "$INSTALLER_TARGET"
          --mode "$INSTALLER_MODE" --version "$INSTALLER_VERSION"
      - name: Install dependency notice generator
        uses: taiki-e/install-action@1919c4a95903d2c33e4a221102edca87309fc14b # v2
        with:
          tool: cargo-about@0.9.3
      - name: Verify application source
        run: pnpm check
      - name: Generate bundled dependency notices
        run: >-
          node ../infrastructure/scripts/notices.mjs
          --source . --target "$INSTALLER_TARGET"
      - name: Build signed installer and updater package
        id: build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: >-
          node ../infrastructure/scripts/release.mjs build
          --source . --target "$INSTALLER_TARGET" --mode "$INSTALLER_MODE"
      - name: Upload private build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: installer-${{ matrix.id }}-${{ needs.plan.outputs.mode }}-${{ needs.plan.outputs.version }}
          path: app/target/installer-artifacts/${{ matrix.id }}/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  publish:
    name: Publish release assets
    needs: [plan, build]
    if: needs.plan.outputs.publication != 'none'
    runs-on: ubuntu-24.04
    # All destination writes are serialized, including feed changes across versions.
    concurrency:
      group: lumina-release-publication
      cancel-in-progress: false
    steps:
      - name: Checkout workflow infrastructure and public docs
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.plan.outputs.infrastructure_sha }}
          path: infrastructure
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: infrastructure/.node-version
      - name: Download checked installer artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: installer-*-${{ needs.plan.outputs.mode }}-${{ needs.plan.outputs.version }}
          path: artifacts
      - name: Upload draft or publish complete release
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
          RELEASE_VERSION: ${{ needs.plan.outputs.version }}
          RELEASE_SOURCE: ${{ needs.plan.outputs.source_sha }}
          RELEASE_PUBLICATION: ${{ needs.plan.outputs.publication }}
        shell: bash
        run: |
          if [[ -z "$GH_TOKEN" ]]; then
            echo "Configure RELEASES_TOKEN, scoped to Kertsu/lumina-releases with Contents read/write."
            exit 1
          fi
          notes=()
          if [[ "$RELEASE_PUBLICATION" == "release" ]]; then
            notes=(--notes "infrastructure/docs/releases/notes/$RELEASE_VERSION.md")
          fi
          node infrastructure/scripts/publish-release.mjs \
            --docs infrastructure/docs/releases/public --artifacts artifacts \
            --version "$RELEASE_VERSION" --source-commit "$RELEASE_SOURCE" \
            --publication "$RELEASE_PUBLICATION" "${notes[@]}"
